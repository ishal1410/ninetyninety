[theme]
base = "light"
primaryColor = "#005EA2"
backgroundColor = "#F4F5F6"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#1B1B1B"
linkColor = "#005EA2"
borderColor = "#DFE1E2"
baseRadius = "2px"
font = "Public Sans, system-ui, sans-serif"
headingFont = "Public Sans, system-ui, sans-serif"
codeFont = "IBM Plex Mono, monospace"
showWidgetBorder = true

[server]
headless = true

[client]
# Never show a traceback (with the server path) to a visitor.
showErrorDetails = "type"
